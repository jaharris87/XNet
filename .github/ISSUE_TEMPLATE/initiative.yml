name: Coordinated work
description: Coordinate a larger objective through focused component issues
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What overall outcome should this coordinated work achieve?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why does this work belong together, and why should it be pursued now?
    validations:
      required: true

  - type: textarea
    id: authority_and_boundaries
    attributes:
      label: Authority and boundaries
      description: What work does this parent issue authorize, and which decisions remain with the human maintainer? It does not authorize redesign or implementation beyond these stated limits.
    validations:
      required: true

  - type: textarea
    id: component_work
    attributes:
      label: Component work
      description: List expected investigations, changes, or decision points. Component code changes should normally use their own bounded issue and pull request.
      placeholder: |
        - [ ] Investigation or component issue:
        - [ ] Investigation or component issue:
    validations:
      required: true

  - type: textarea
    id: native_subissues
    attributes:
      label: Native GitHub subissues and live status
      description: State the planned native parent/subissue relationships and where the live parent status will be kept. Create the native relationships after opening the parent issue; a Markdown checklist may mirror them but cannot replace them.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and ordering
      description: Which components depend on earlier findings or merges?

  - type: textarea
    id: integration_criteria
    attributes:
      label: Integration criteria
      description: What must be true after the component changes are combined?
    validations:
      required: true

  - type: textarea
    id: final_validation
    attributes:
      label: Final validation
      description: What repository-level, numerical, scientific, portability, or performance checks are needed before this work is complete?
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What adjacent modernization or cleanup is intentionally excluded?

  - type: textarea
    id: completion_conditions
    attributes:
      label: Completion conditions
      description: State the clear conditions under which this parent issue may be closed. Do not treat it as one large implementation prompt.
    validations:
      required: true

  - type: textarea
    id: status_record
    attributes:
      label: Parent status
      description: Record the date, current development SHA, completed/active/blocked native children, changed dependencies, and remaining work. Leave the initial record brief and update it in issue comments as work proceeds.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other information needed to understand or coordinate the work.

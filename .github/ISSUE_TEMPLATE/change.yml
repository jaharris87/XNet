name: Bounded change
description: Define a focused implementation with explicit completion evidence
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What behavior, limitation, or need does this change address?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why does this matter to users, maintainers, scientific results, portability, or performance?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What cohesive implementation work is included? Do not use this issue for a broad modernization objective.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What related cleanup, redesign, migration, optimization, or follow-up work should be excluded?

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that will show the work is complete, rather than implementation steps.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: required_evidence
    attributes:
      label: Required evidence
      description: State the build, execution, numerical, scientific, portability, interface, or performance evidence needed. Mark categories that do not apply.
    validations:
      required: true

  - type: checkboxes
    id: expected_effects
    attributes:
      label: Expected effects
      description: Select effects that are expected or require checking. Leave this blank when none are known.
      options:
        - label: Numerical results
        - label: Floating-point ordering or reproducibility
        - label: Convergence behavior
        - label: Scientific interpretation
        - label: Runtime inputs or outputs
        - label: Public interfaces
        - label: Portability
        - label: Performance
        - label: Dependencies or language requirements

  - type: textarea
    id: review_risk
    attributes:
      label: Independent review risks
      description: Select the applicable risk classes from docs/development/review-playbook.md, the likely review roles and evidence, and any human-only decision. Multiple classes may apply; use D, T, P, S, B, or H.

  - type: textarea
    id: test_effectiveness
    attributes:
      label: Test effectiveness
      description: For a defect fix or behavioral change, state what incorrect or missing behavior the check should detect, whether it should fail before the fix, and how that will be shown when practical.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: List prerequisite investigations, related issues, upstream work, or deferred follow-up.

  - type: textarea
    id: coordination_handoff
    attributes:
      label: Coordination and handoff record
      description: For medium/high-risk work, identify current status, governing and parent issue, authorized scope, explicit non-goals, applicable playbook risk classes and risk-selected review roles, required checks, current exact pushed candidate SHA when known, requested decision, limitations, and blocking questions. Omit for trivial work.

  - type: textarea
    id: review_follow_up
    attributes:
      label: Review-generated follow-up record
      description: If this issue follows a review finding, record the originating PR, reviewed exact candidate SHA and stable finding ID when known, disposition, non-blocking reason, accepted-claim effect, bounded scope, non-goals, trigger or priority, completion evidence, and parent relationship.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other information needed to understand the proposed change.
